
<!DOCTYPE html>
<html lang="pt-BR">

<title>Mine Fire</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #204b32, #080e0a 75%);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

.logo {
  font-size: 75px;
  margin-bottom: 15px;
}

h1 {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 3px;
}

.subtitle {
  color: #a9c4b1;
  margin: 15px 0 30px;
  line-height: 1.6;
}

.card {
  background: #142019;
  border: 1px solid #315b3e;

  box-shadow: 0 15px 50px #0008;

.file {

  padding: 17px;

.file-icon {

}

.file-name {
  font-weight: bold;
}

.file-info {
  color: #91a997;
  font-size: 12px;
  margin-top: 6px;
}

.download {
  display: block;
  background: linear-gradient(90deg, #50e889, #20bd60);
  color: #07150b;
  padding: 18px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 900;
  font-size: 17px;
  transition: .2s;
}

.download:hover {
  transform: scale(1.03);
  filter: brightness(1.1);
}

.info {
  color: #91a997;
  font-size: 12px;
  margin-top: 18px;
  line-height: 1.5;
}

footer {
  margin-top: 25px;
  color: #718979;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

  </p>

  <div class="card">

        </div>

          APK • Android
        </div>

       target="_blank"
       rel="noopener noreferrer">

</html>
